<!doctype html>
<!-- Weather dashboard page. The forecast sections start hidden and are filled in by src/js/render.js. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Current conditions, 24-hour and 7-day forecast for any city. Responsive, accessible, no API key.">
    <meta name="theme-color" content="#1f4fb8">
    <title>Weather Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
    <link rel="stylesheet" href="src/css/styles.css">
    <script type="module" src="src/js/main.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to forecast</a>

<header class="app-header">
    <h1 class="brand">⛅ Weather</h1>

    <form class="search" id="search-form" role="search" autocomplete="off">
        <label class="visually-hidden" for="search-input">Search for a city</label>
        <input id="search-input" type="search" placeholder="Search for a city"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </form>

    <div class="header-actions">
        <button id="locate-button" type="button" class="icon-button" aria-label="Use my location" title="Use my location">📍</button>
        <div class="unit-toggle" role="radiogroup" aria-label="Temperature unit">
            <button type="button" role="radio" data-unit="celsius" aria-checked="true">°C</button>
            <button type="button" role="radio" data-unit="fahrenheit" aria-checked="false">°F</button>
        </div>
    </div>
</header>

<nav class="recent" aria-label="Recent places">
    <ul id="recent-list"></ul>
</nav>

<main id="main" class="dashboard" aria-busy="false">
    <p id="message" class="message" role="status" aria-live="polite">Search for a city or use your location to see the forecast.</p>

    <section id="current" class="card current" aria-labelledby="current-heading" hidden>
        <h2 id="current-heading" class="place"></h2>
        <div class="current-main">
            <span class="current-icon" aria-hidden="true"></span>
            <p class="current-temp"></p>
        </div>
        <p class="current-label"></p>
        <dl class="current-details">
            <div><dt>Feels like</dt><dd data-field="feels"></dd></div>
            <div><dt>Humidity</dt><dd data-field="humidity"></dd></div>
            <div><dt>Wind</dt><dd data-field="wind"></dd></div>
            <div><dt>Sunrise</dt><dd data-field="sunrise"></dd></div>
            <div><dt>Sunset</dt><dd data-field="sunset"></dd></div>
        </dl>
    </section>

    <section id="hourly" class="card hourly" aria-labelledby="hourly-heading" hidden>
        <h2 id="hourly-heading">Next 24 hours</h2>
        <ol class="hour-strip" tabindex="0" aria-label="Hourly forecast, scrollable"></ol>
    </section>

    <section id="daily" class="card daily" aria-labelledby="daily-heading" hidden>
        <h2 id="daily-heading">7-day forecast</h2>
        <ol class="day-list"></ol>
    </section>
</main>

<footer class="app-footer">
    Weather data by <a href="https://open-meteo.com/" rel="noopener">Open-Meteo</a> (CC BY 4.0).
</footer>
</body>
</html>
